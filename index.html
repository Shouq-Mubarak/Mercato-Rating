  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Tajawal', 'Cairo', sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    .font-cairo { font-family: 'Cairo', sans-serif; }
    .font-outfit { font-family: 'Outfit', sans-serif; }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 9999px; }

    /* Touch Button Bounce */
    .touch-bounce {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .touch-bounce:active {
      transform: scale(0.96);
    }

    /* Star Interaction Animation */
    .star-btn {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.15s ease;
    }
    .star-btn:active {
      transform: scale(1.4) rotate(-8deg);
    }

    /* Star pop animation: works reliably on touch screens as well as desktop. */
    @keyframes star-pop {
      0% { transform: scale(1) rotate(0deg); }
      35% { transform: scale(1.42) rotate(-10deg); }
      65% { transform: scale(1.12) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .star-btn.star-pop {
      animation: star-pop 0.52s cubic-bezier(.2,.8,.2,1) both;
    }
    .star-btn.star-pop i {
      animation: star-icon-pop 0.52s cubic-bezier(.2,.8,.2,1) both;
      filter: drop-shadow(0 0 7px rgba(245,158,11,.45));
    }
    @keyframes star-icon-pop {
      0% { transform: scale(1) rotate(0deg); }
      35% { transform: scale(1.22) rotate(8deg); }
      65% { transform: scale(1.08) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Light reveal animation for the notes box on 1-3 stars. */
    @keyframes feedback-reveal {
      0% { opacity: 0; transform: translateY(10px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .feedback-reveal {
      animation: feedback-reveal 0.38s cubic-bezier(.2,.8,.2,1) both;
    }


    /* Notes field: hidden until 1-3 stars, then softly revealed in-place. */
    #stepComplaintFlow { overflow:hidden; }
    #stepComplaintFlow.feedback-reveal textarea { animation: feedback-reveal .38s cubic-bezier(.2,.8,.2,1) both; }
    #stepComplaintFlow.feedback-reveal button { animation: feedback-reveal .48s cubic-bezier(.2,.8,.2,1) both; }

    /* Pulse Glow */
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(2, 119, 189, 0.35); }
      50% { transform: scale(1.02); box-shadow: 0 12px 30px rgba(173, 20, 87, 0.45); }
    }
    .btn-pulse {
      animation: pulse-subtle 2.5s infinite ease-in-out;
    }

    /* Textile Mesh Background Overlay */
    .denim-pattern {
      background-color: #f8fafc;
      background-image: radial-gradient(rgba(2, 136, 209, 0.08) 1px, transparent 1px),
                        radial-gradient(rgba(173, 20, 87, 0.06) 1px, #f8fafc 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    /* Logo framing: the source image is clipped to the circular green frame on every device. */
    .mercato-logo-circle {
      border-radius: 50% !important;
      overflow: hidden !important;
      aspect-ratio: 1 / 1;
    }
    .mercato-logo-circle img {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      object-fit: cover !important;
      object-position: center !important;
      border-radius: 50% !important;
    }

    /* Customer view: branch is fixed by the QR/link and cannot be changed manually. */

    // Sentiment labels shown with the selected star rating.
    const SENTIMENTS = {
      1: { text: 'غير راضٍ عن التجربة', emoji: '😡', color: 'text-rose-600 bg-rose-50 border-rose-200' },
      2: { text: 'تجربة دون المأمول', emoji: '🙁', color: 'text-orange-600 bg-orange-50 border-orange-200' },
      3: { text: 'مقبولة وبحاجة للتحسين', emoji: '😐', color: 'text-amber-600 bg-amber-50 border-amber-200' },
      4: { text: 'تسوق رائع ومميز!', emoji: '😊', color: 'text-sky-600 bg-sky-50 border-sky-200' },
      5: { text: 'ماركات وتجربة استثنائية! 🌿', emoji: '🤩', color: 'text-mercato-lime bg-lime-50 border-lime-300' }
    };

    let activeBranch = MERCATO_BRANCHES['K7a'];
    let hasValidBranch = false;
    let currentRatingValue = 0;

    // Initialization on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initBranchFromUrl();
    });

    // Extract Branch code from URL Search Query (?branch=code)
    function initBranchFromUrl() {
      hasValidBranch = false;
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const branchCode = (urlParams.get('branch') || '').trim();
        if (MERCATO_BRANCHES[branchCode]) {
          activeBranch = MERCATO_BRANCHES[branchCode];
          hasValidBranch = true;
        } else {
          activeBranch = MERCATO_BRANCHES['K7a'];
        }
      } catch (err) {
        activeBranch = MERCATO_BRANCHES['K7a'];
        hasValidBranch = false;
      }
      refreshBranchBindings();
    }

    function refreshBranchBindings() {
      const headerBranchLabel = document.getElementById('headerBranchLabel');
      if (headerBranchLabel) headerBranchLabel.innerText = activeBranch.name;
    }

    // Rate store function triggered by clicking any star
    function rateStore(stars) {
      triggerHaptic(30);
      currentRatingValue = stars;

      highlightStars(stars);

      const tappedStar = document.querySelector(`#starContainer .star-btn[data-rating="${stars}"]`);
      if (tappedStar) {
        tappedStar.classList.remove('star-pop');
        void tappedStar.offsetWidth;
        tappedStar.classList.add('star-pop');
        setTimeout(() => tappedStar.classList.remove('star-pop'), 450);
      }

      renderSentimentLabel(stars);

      // Gentle transition timeout
      setTimeout(() => {
        executeGatingLogic(stars);
      }, 350);
    }

    function highlightStars(count) {
      // Each button carries its real rating value, so RTL/CSS order can never change the score.
      const starButtons = document.querySelectorAll('#starContainer .star-btn');
      starButtons.forEach((btn) => {
        const starValue = Number(btn.dataset.rating);
        const isFilled = starValue <= count;
        btn.classList.toggle('text-amber-400', isFilled);
        btn.classList.toggle('text-slate-300', !isFilled);
      });
    }

    function renderSentimentLabel(stars) {
      const badge = document.getElementById('sentimentDisplay');
      const emojiEl = document.getElementById('sentimentEmoji');
      const textEl = document.getElementById('sentimentText');
      const sentiment = SENTIMENTS[stars];
      if (!badge || !emojiEl || !textEl || !sentiment) return;

      emojiEl.innerText = sentiment.emoji;
      textEl.innerText = sentiment.text;
      badge.className = `transition-opacity duration-200 inline-flex items-center gap-2 text-xs font-bold py-1 px-3.5 rounded-full border ${sentiment.color} opacity-100 shadow-sm`;
    }

    // Review Gating core logic
    function executeGatingLogic(stars) {
      const stepComplaint = document.getElementById('stepComplaintFlow');

      if (stars >= 4) {
        // 4-5 stars: celebration, then direct Google review page.
        shootMercatoConfetti();
        triggerHaptic(stars === 5 ? [25, 35, 25] : [20, 30]);

        if (hasValidBranch) {
          setTimeout(() => {
            window.location.href = activeBranch.googleMapsUrl;
          }, 2450);
        }
      } else {
        // 1-3 stars: reveal the notes box on the same page.
        stepComplaint.classList.remove('hidden');
        stepComplaint.classList.remove('feedback-reveal');
        void stepComplaint.offsetWidth;
        stepComplaint.classList.add('feedback-reveal');
      }

      lucide.createIcons();
    }

    // Mercato Themed Confetti Explosion
    function shootMercatoConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 75,
          spread: 70,
          origin: { y: 0.65 },
          colors: ['#0288d1', '#ad1457', '#7cb342', '#0b5394', '#f59e0b']
        });
      }
    }

    // Send the customer's exact comment to Mercato support via WhatsApp.
    function submitCustomerComplaint(e) {
      e.preventDefault();

      const details = document.getElementById('custDetails').value.trim();
      if (!details) return;

      const score = currentRatingValue || 1;
      const message =
        `مرحباً دعم ميركاتو،\n` +
        `لدي ملاحظة من عميل على ${activeBranch.name}.\n` +
        `التقييم: ${score}/5\n` +
        `الملاحظة: ${details}`;

      const whatsappUrl = `https://wa.me/966920021310?text=${encodeURIComponent(message)}`;

      triggerHaptic([30, 50, 30]);

      window.location.href = whatsappUrl;
    }

    // Mobile Vibration Haptic Feedback
    function triggerHaptic(duration) {
      if ('vibrate' in navigator) {
        try {
          navigator.vibrate(duration);
        } catch(e) {}
      }
    }
