<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MERCATO | تقييم تجربتك</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Tahoma,sans-serif;
  background:#fff;
  color:#222;
  overflow-x:hidden;
}

/* الزخارف */
body::before,
body::after{
  content:"";
  position:fixed;
  width:180px;
  height:180px;
  pointer-events:none;
  z-index:0;
}

body::before{
  top:-25px;
  left:-45px;
  background:
    linear-gradient(
      55deg,
      transparent 48%,
      rgba(44,121,168,.16) 49% 61%,
      transparent 62%
    ),
    linear-gradient(
      125deg,
      transparent 48%,
      rgba(194,77,145,.12) 49% 61%,
      transparent 62%
    ),
    linear-gradient(
      0deg,
      transparent 48%,
      rgba(44,155,120,.12) 49% 61%,
      transparent 62%
    );
}

body::after{
  bottom:-30px;
  right:-35px;
  background:
    linear-gradient(
      125deg,
      transparent 48%,
      rgba(194,77,145,.20) 49% 61%,
      transparent 62%
    ),
    linear-gradient(
      55deg,
      transparent 48%,
      rgba(44,121,168,.14) 49% 61%,
      transparent 62%
    ),
    linear-gradient(
      0deg,
      transparent 48%,
      rgba(44,155,120,.13) 49% 61%,
      transparent 62%
    );
}


/* الصفحة */

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:35px 20px;
  position:relative;
  z-index:1;
}

.card{
  width:100%;
  max-width:650px;
  text-align:center;
  padding:35px 35px 25px;
  position:relative;
}


/* الصورة */

.logo-wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  width:78px;
  height:78px;
  object-fit:contain;
  display:block;
}


/* العنوان */

h1{
  margin:0 0 8px;
  font-size:28px;
  color:#17344a;
  font-weight:700;
}

.description{
  margin:0 0 18px;
  color:#777;
  font-size:14px;
}


/* الخط الملون */

.color-line{
  width:80px;
  height:3px;
  margin:0 auto 18px;
  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #2c9b78 0 33%,
      #2879a8 33% 66%,
      #c24d91 66%
    );
}


/* النجوم */

.stars{
  direction:rtl;
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:4px;
}

.star{
  color:#e8edf2;
  font-size:42px;
  line-height:1;
  cursor:pointer;
  transition:.18s ease;
  user-select:none;
}

.star:hover{
  transform:scale(1.08);
}

.star.active{
  color:#f5b735;
}


/* نص التقييم */

#ratingText{
  min-height:24px;
  margin:8px 0 18px;
  color:#555;
  font-size:13px;
}


/* الملاحظات */

label{
  display:block;
  text-align:right;
  color:#17344a;
  font-weight:700;
  margin:0 auto 7px;
  max-width:470px;
  font-size:13px;
}

textarea{
  display:block;
  width:100%;
  max-width:470px;
  height:95px;

  resize:none;

  margin:0 auto 16px;

  border:1px solid #e5e8ec;
  border-radius:12px;

  padding:12px;

  font-family:inherit;
  font-size:13px;

  outline:none;

  background:#fff;
  color:#333;

  box-shadow:
    0 2px 8px rgba(0,0,0,.03);
}

textarea::placeholder{
  color:#c5c5c5;
}

textarea:focus{
  border-color:#2879a8;

  box-shadow:
    0 0 0 3px rgba(40,121,168,.07);
}


/* الزر */

button{
  width:170px;

  border:0;
  border-radius:999px;

  padding:11px 18px;

  background:
    linear-gradient(
      90deg,
      #2879d8,
      #1874d1
    );

  color:#fff;

  font-family:inherit;
  font-size:13px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 5px 15px rgba(40,121,216,.20);

  transition:.2s ease;
}

button:hover{
  transform:translateY(-1px);

  box-shadow:
    0 7px 18px rgba(40,121,216,.25);
}

button span{
  margin-left:7px;
  font-size:15px;
}


/* الفوتر */

footer{
  margin-top:18px;
  color:#aaa;
  font-size:11px;
}


/* الجوال */

@media(max-width:600px){

  .page{
    padding:25px 15px;
  }

  .card{
    padding:25px 15px 20px;
  }

  .logo{
    width:75px;
    height:75px;
  }

  h1{
    font-size:24px;
  }

  .description{
    font-size:13px;
  }

  .star{
    font-size:40px;
  }

  textarea{
    height:90px;
  }

  button{
    width:160px;
  }
}
</style>

</head>


<body>

<div class="page">

<main class="card">


<!-- صورة MERCATO -->
<div class="logo-wrapper">

<img
  src="./logo.jpeg.jpeg"
  class="logo"
  alt="MERCATO"
>

</div>


<!-- العنوان -->

<h1>
كيف كانت تجربتك معنا؟
</h1>


<p class="description">
شاركنا تقييمك
</p>


<div class="color-line"></div>


<!-- النجوم -->

<div
  class="stars"
  aria-label="التقييم"
>

<span
  class="star"
  data-rating="1"
>★</span>

<span
  class="star"
  data-rating="2"
>★</span>

<span
  class="star"
  data-rating="3"
>★</span>

<span
  class="star"
  data-rating="4"
>★</span>

<span
  class="star"
  data-rating="5"
>★</span>

</div>


<div id="ratingText"></div>


<!-- الملاحظات -->

<label for="feedback">
ملاحظاتك تهمنا ✎
</label>


<textarea
  id="feedback"
  placeholder="اكتب لنا تعليقاتك هنا..."
></textarea>


<!-- الزر -->

<button
  type="button"
  onclick="submitRating()"
>

<span>←</span>

إرسال التقييم

</button>


<footer>
شكراً لك على وقتك ومشاركتك لرأيك 🤍
</footer>


</main>

</div>


<script>

/* =========================
   واتساب الدعم
========================= */

const supportUrl =
"https://wa.me/966920021310";


/* =========================
   روابط Google لكل فرع
========================= */

const branchLinks = {

"1":
"https://g.page/r/Ca3jSr1Z0dUYEBM/review",

"2":
"https://g.page/r/CdllYciMoT8GEBM/review",

"3":
"https://g.page/r/CbNrebES7OEiEBM/review",

"4":
"https://g.page/r/CVAh0_CJDoo1EBM/review",

"5":
"https://g.page/r/CfrU07iMJpmpEBM/review",

"6":
"https://g.page/r/CQRdKswUzDrTEBM/review",

"7":
"https://g.page/r/Cd427IaBBwTDEBM/review",

"8":
"https://maps.app.goo.gl/jsJ6x368d5EQ8ht6A",

"9":
"https://g.page/r/CWbsamymNfqbEBM/review",

"10":
"https://g.page/r/CWT69dlXEyXDEBM/review",

"11":
"https://g.page/r/CSPtzNKMBkSTEBM/review",

"12":
"https://g.page/r/CaUq9hk10TkFEBM/review",

"13":
"https://g.page/r/CSVAo0c_XHlMEBM/review",

"14":
"https://g.page/r/CU12tV0Av1tWEBM/review",

"15":
"https://g.page/r/CX6cv1eiMksiEBM/review",

"16":
"https://g.page/r/CWxbPgb3sCpLEBM/review",

"17":
"https://g.page/r/CQc_0qnQtHzyEBM/review",

"18":
"https://maps.app.goo.gl/LN2hneroRqdXBQVY8",

"19":
"https://g.page/r/CeRzQxhd84AIEBM/review",

"20":
"https://g.page/r/CV7O-FIlni6REBM/review",

"21":
"https://g.page/r/CfK7zOR61FmhEBM/review"

};


/* =========================
   معرفة رقم الفرع
========================= */

const branch =
new URLSearchParams(
window.location.search
).get("branch");


/* =========================
   النجوم
========================= */

const stars =
document.querySelectorAll(".star");

const ratingText =
document.getElementById("ratingText");

let selectedRating = 0;


stars.forEach(star => {

  star.addEventListener(
    "click",
    function(){

      selectedRating =
      Number(this.dataset.rating);


      stars.forEach(item => {

        item.classList.toggle(
          "active",
          Number(item.dataset.rating)
          <= selectedRating
        );

      });


      ratingText.textContent = {

        1:
        "نأسف أن تجربتك لم تكن بالمستوى المطلوب",

        2:
        "نحتاج إلى تحسين تجربتك",

        3:
        "تجربة جيدة",

        4:
        "تجربة ممتازة",

        5:
        "تجربة رائعة! 🤍"

      }[selectedRating];

    }
  );

});


/* =========================
   إرسال التقييم
========================= */

function submitRating(){

  /* لازم يختار تقييم */

  if(!selectedRating){

    alert(
      "فضلاً اختر تقييمك أولاً ⭐"
    );

    return;
  }


  /*

  1 - 3 نجوم
  يذهب إلى واتساب

  */

  if(selectedRating <= 3){

    window.location.href =
    supportUrl;

    return;
  }


  /*

  4 - 5 نجوم
  يذهب إلى Google الخاص بالفرع

  */

  const reviewUrl =
  branchLinks[branch];


  if(reviewUrl){

    window.location.href =
    reviewUrl;

  }

  else{

    alert(
      "تعذر تحديد الفرع. تأكدي من رابط التقييم."
    );

  }

}

</script>

</body>
</html>
