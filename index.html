<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MERCATO | قيّم تجربتك معنا</title>

<style>
:root {
    --color-primary: #2760a8;
    --color-secondary: #b43784;
    --color-light: #f1e4ed;
    --color-background: #f3ecf3;
    --color-dark: #333333;
    --color-gray: #777777;
    --color-border: #dddddd;
    --color-star: #f5b400;
}

* {
    box-sizing: border-box;
}

html,
body,
button,
textarea {
    font-family: 'CALRO', 'Cairo', Arial, Tahoma, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--color-background);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;
    color: var(--color-dark);
}

.container {
    width: 100%;
    max-width: 470px;

    background: #ffffff;

    padding: 32px 28px 27px;

    border-radius: 24px;

    text-align: center;

    border-top: 5px solid var(--color-primary);

    box-shadow: 0 10px 35px rgba(39, 96, 168, 0.10);
}


/* =========================
   LOGO
========================= */

.logo-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 18px;
}

.logo {
    width: 92px;
    height: 92px;

    object-fit: cover;

    border-radius: 50%;

    background: #ffffff;

    padding: 0;

    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
}


/* =========================
   TITLE
========================= */

h1 {
    margin: 0 0 8px;

    color: var(--color-primary);

    font-size: 27px;

    font-weight: 700;
}

.subtitle {
    margin: 0 0 18px;

    color: var(--color-gray);

    font-size: 14px;
}

.brand-line {
    width: 80px;
    height: 4px;

    margin: 0 auto 22px;

    border-radius: 20px;

    background: linear-gradient(
        90deg,
        var(--color-primary) 0 50%,
        var(--color-secondary) 50% 100%
    );
}


/* =========================
   STARS
========================= */

.stars {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 7px;

    direction: ltr;

    margin-bottom: 8px;
}

.star {
    font-size: 42px;

    line-height: 1;

    color: #d9d9d9;

    cursor: pointer;

    user-select: none;

    transition:
        transform 0.18s ease,
        color 0.18s ease;
}

.star:hover {
    transform: scale(1.10);
}

.star.active {
    color: var(--color-star);
}


/* =========================
   RATING MESSAGE
========================= */

.rating-message {
    min-height: 25px;

    margin: 8px 0 18px;

    color: var(--color-primary);

    font-size: 13px;

    font-weight: 600;
}


/* =========================
   FEEDBACK
========================= */

.feedback-section {
    display: none;

    animation: fadeIn 0.25s ease;
}

.feedback-section.show {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.comment-title {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 7px;

    margin-bottom: 9px;

    color: var(--color-dark);

    font-size: 14px;

    font-weight: 600;
}

.comment-icon {
    color: var(--color-secondary);

    font-size: 19px;
}


/* =========================
   TEXTAREA
========================= */

textarea {
    width: 100%;

    height: 105px;

    resize: none;

    border: 1px solid var(--color-border);

    border-radius: 13px;

    padding: 12px;

    outline: none;

    background: #ffffff;

    color: var(--color-dark);

    font-size: 14px;

    line-height: 1.7;
}

textarea::placeholder {
    color: #aaaaaa;
}

textarea:focus {
    border-color: var(--color-primary);

    box-shadow: 0 0 0 3px rgba(39, 96, 168, 0.08);
}


/* =========================
   SUPPORT BUTTON
========================= */

.support-button {
    margin-top: 17px;

    width: 210px;

    padding: 12px 18px;

    border: none;

    border-radius: 30px;

    background-color: var(--color-secondary);

    color: #ffffff;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s ease;

    box-shadow: 0 5px 14px rgba(180, 55, 132, 0.20);
}

.support-button:hover {
    transform: translateY(-1px);

    background-color: #9f2f73;
}


/* =========================
   GOOGLE MESSAGE
========================= */

.google-message {
    display: none;

    margin-top: 14px;

    color: var(--color-primary);

    font-size: 13px;

    line-height: 1.8;
}

.google-message.show {
    display: block;
}


/* =========================
   FOOTER
========================= */

footer {
    margin-top: 20px;

    color: #999999;

    font-size: 11px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {
        padding: 18px 12px;
    }

    .container {
        padding: 28px 20px 24px;

        border-radius: 21px;
    }

    .logo {
        width: 84px;
        height: 84px;
    }

    h1 {
        font-size: 24px;
    }

    .star {
        font-size: 38px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo-wrapper">
        <img
            src="./logo.jpeg.jpeg"
            class="logo"
            alt="MERCATO"
        >
    </div>


    <!-- TITLE -->
    <h1>قيّم تجربتك معنا</h1>

    <p class="subtitle">
        شاركنا تقييمك
    </p>

    <div class="brand-line"></div>


    <!-- STARS -->
    <div class="stars">

        <span
            class="star"
            data-rating="1"
            onclick="selectRating(1)"
        >★</span>

        <span
            class="star"
            data-rating="2"
            onclick="selectRating(2)"
        >★</span>

        <span
            class="star"
            data-rating="3"
            onclick="selectRating(3)"
        >★</span>

        <span
            class="star"
            data-rating="4"
            onclick="selectRating(4)"
        >★</span>

        <span
            class="star"
            data-rating="5"
            onclick="selectRating(5)"
        >★</span>

    </div>


    <!-- RATING MESSAGE -->
    <div
        id="ratingMessage"
        class="rating-message"
    ></div>


    <!-- FEEDBACK SECTION -->
    <div
        id="feedbackSection"
        class="feedback-section"
    >

        <div class="comment-title">

            <span class="comment-icon">
                ✎
            </span>

            <span>
                ملاحظاتك تهمنا
            </span>

        </div>


        <textarea
            id="comment"
            placeholder="اكتب تعليقك هنا..."
        ></textarea>


        <button
            type="button"
            class="support-button"
            onclick="sendToSupport()"
        >
            التواصل مع الدعم الفني
        </button>

    </div>


    <!-- GOOGLE MESSAGE -->
    <div
        id="googleMessage"
        class="google-message"
    >
        شكرًا لك على تقييمك 🤍
        <br>
        سيتم تحويلك الآن لتقييم تجربتك على Google
    </div>


    <!-- FOOTER -->
    <footer>
        شكراً لك على وقتك ومشاركتك لرأيك
    </footer>

</div>


<script>

/* =========================
   BRANCHES
========================= */

const branches = {

    "01": {
        name: "الرياض – الملز",
        review: "https://g.page/r/Ca3jSr1Z0dUYEBM/review"
    },

    "02": {
        name: "الرياض – اشبيليه",
        review: "https://g.page/r/CdllYciMoT8GEBM/review"
    },

    "03": {
        name: "الرياض – الشفا",
        review: "https://g.page/r/CbNrebES7OEiEBM/review"
    },

    "04": {
        name: "الرياض – النسيم",
        review: "https://g.page/r/CVAh0_CJDoo1EBM/review"
    },

    "05": {
        name: "جدة – الفيصلية",
        review: "https://g.page/r/CfrU07iMJpmpEBM/review"
    },

    "06": {
        name: "الطائف – شارع أبوبكر",
        review: "https://g.page/r/CQRdKswUzDrTEBM/review"
    },

    "07": {
        name: "الدمام – حياة بلازا",
        review: "https://g.page/r/Cd427IaBBwTDEBM/review"
    },

    "08": {
        name: "الدمام – النخيل",
        review: "https://g.page/r/CXPiyk6_F2pjEBM/review"
    },

    "09": {
        name: "الخبر – الخبر الشمالية",
        review: "https://g.page/r/CWbsamymNfqbEBM/review"
    },

    "10": {
        name: "عنيزة – السليمانية",
        review: "https://g.page/r/CWT69dlXEyXDEBM/review"
    },

    "11": {
        name: "بريدة – الاسكان",
        review: "https://g.page/r/CSPtzNKMBkSTEBM/review"
    },

    "12": {
        name: "المدينة المنورة – الجماوات",
        review: "https://g.page/r/CaUq9hk10TkFEBM/review"
    },

    "13": {
        name: "تبوك – العزيزية القديمة",
        review: "https://g.page/r/CSVAo0c_XHlMEBM/review"
    },

    "14": {
        name: "حائل – الزباره",
        review: "https://g.page/r/CU12tV0Av1tWEBM/review"
    },

    "15": {
        name: "أبها – الربوة",
        review: "https://g.page/r/CX6cv1eiMksiEBM/review"
    },

    "16": {
        name: "أبها الجديد – طريق الملك فهد",
        review: "https://g.page/r/CWxbPgb3sCpLEBM/review"
    },

    "17": {
        name: "خميس مشيط – الرصراص",
        review: "https://g.page/r/CQc_0qnQtHzyEBM/review"
    },

    "18": {
        name: "محايل عسير – طريق الملك عبدالعزيز",
        review: "https://g.page/r/CbMXRafIapltEBM/review"
    },

    "19": {
        name: "نجران – الفيصلية",
        review: "https://g.page/r/CeRzQxhd84AIEBM/review"
    },

    "20": {
        name: "الأحساء – المسعودي",
        review: "https://g.page/r/CV7O-FIlni6REBM/review"
    },

    "21": {
        name: "حفر الباطن – الخالدية",
        review: "https://g.page/r/CfK7zOR61FmhEBM/review"
    }

};


/* =========================
   GET BRANCH FROM URL
========================= */

const params = new URLSearchParams(
    window.location.search
);

let rawBranchID =
    params.get("branch") || "01";

const branchID =
    rawBranchID.padStart(2, "0");

const currentBranch =
    branches[branchID] || branches["01"];


/* =========================
   SELECTED RATING
========================= */

let selectedRating = 0;


/* =========================
   SELECT RATING
========================= */

function selectRating(rating) {

    selectedRating = rating;


    /* Update stars */

    const allStars =
        document.querySelectorAll(".star");

    allStars.forEach((star, index) => {

        if (index < rating) {

            star.classList.add("active");

        } else {

            star.classList.remove("active");

        }

    });


    /* Elements */

    const feedbackSection =
        document.getElementById(
            "feedbackSection"
        );

    const googleMessage =
        document.getElementById(
            "googleMessage"
        );

    const ratingMessage =
        document.getElementById(
            "ratingMessage"
        );


    /* =========================
       1 - 3 STARS
    ========================= */

    if (rating <= 3) {

        feedbackSection.classList.add(
            "show"
        );

        googleMessage.classList.remove(
            "show"
        );


        const messages = {

            1: "نأسف أن تجربتك لم تكن بالمستوى المطلوب",

            2: "نحتاج إلى تحسين تجربتك",

            3: "نقدّر ملاحظتك ونسعى دائمًا للتحسين"

        };


        ratingMessage.textContent =
            messages[rating];

    }


    /* =========================
       4 - 5 STARS
    ========================= */

    else {

        feedbackSection.classList.remove(
            "show"
        );

        googleMessage.classList.add(
            "show"
        );

        ratingMessage.textContent =
            "شكرًا لك على تقييمك 🤍";


        /*
         * تحويل العميل مباشرة
         * إلى صفحة كتابة تقييم Google
         */

        setTimeout(function () {

            window.location.href =
                currentBranch.review;

        }, 700);

    }

}


/* =========================
   SEND TO WHATSAPP
========================= */

function sendToSupport() {

    /* Make sure rating exists */

    if (selectedRating === 0) {

        alert(
            "فضلاً اختر تقييمك أولاً."
        );

        return;
    }


    /* Get comment */

    const commentElement =
        document.getElementById(
            "comment"
        );

    const comment =
        commentElement.value.trim();


    /* Make sure comment exists */

    if (!comment) {

        alert(
            "فضلاً اكتب ملاحظتك قبل التواصل مع الدعم الفني."
        );

        commentElement.focus();

        return;
    }


    /* Create WhatsApp message */

    const message =
        "مرحباً، لدي ملاحظة على تجربتي مع MERCATO.\n\n" +

        "الفرع: " +
        currentBranch.name +
        "\n" +

        "التقييم: " +
        selectedRating +
        " من 5\n\n" +

        "الملاحظة:\n" +
        comment;


    /* WhatsApp URL */

    const whatsappURL =
        "https://wa.me/966920021310?text=" +
        encodeURIComponent(message);


    /* Open WhatsApp */

    window.location.href =
        whatsappURL;

}

</script>

</body>
</html>
