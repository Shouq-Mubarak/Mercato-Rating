
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MERCATO | تقييم تجربتك</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #176b99;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 8% 15%,
                    rgba(91, 157, 76, 0.10) 0,
                    rgba(91, 157, 76, 0.04) 130px,
                    transparent 280px
                ),
                radial-gradient(
                    circle at 92% 12%,
                    rgba(35, 110, 155, 0.10) 0,
                    rgba(35, 110, 155, 0.035) 150px,
                    transparent 300px
                ),
                radial-gradient(
                    circle at 88% 88%,
                    rgba(181, 69, 139, 0.07) 0,
                    rgba(181, 69, 139, 0.025) 140px,
                    transparent 290px
                ),
                radial-gradient(
                    circle at 12% 90%,
                    rgba(91, 157, 76, 0.06) 0,
                    transparent 250px
                ),
                #ffffff;
        }


        body::before {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            top: -150px;
            right: -100px;
            border: 1px solid rgba(35, 110, 155, 0.08);
            pointer-events: none;
        }


        body::after {
            content: "";
            position: fixed;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            bottom: -130px;
            left: -80px;
            border: 1px solid rgba(91, 157, 76, 0.08);
            pointer-events: none;
        }


        /* الهيدر */

        header {
            width: 100%;
            height: 115px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.72);

            border-bottom: 1px solid rgba(23, 107, 153, 0.06);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            position: relative;
            z-index: 2;
        }


        /* الشعار */

        .logo {
            width: 145px;
            height: auto;
            display: block;
        }


        /* المحتوى */

        .container {
            min-height: calc(100vh - 115px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px 70px;

            position: relative;
            z-index: 1;
        }


        /* البطاقة */

        .card {
            width: 100%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.84);

            border-radius: 30px;

            padding: 48px 50px 42px;

            text-align: center;

            border: 1px solid rgba(23, 107, 153, 0.08);

            box-shadow:
                0 20px 70px rgba(23, 107, 153, 0.06),
                0 5px 25px rgba(91, 157, 76, 0.035);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }


        /* اسم البراند */

        .small-title {
            font-size: 12px;
            letter-spacing: 4px;

            color: #5b9d4c;

            margin-bottom: 16px;

            font-weight: 600;
        }


        /* العنوان */

        h1 {
            margin: 0;

            font-size: 34px;

            line-height: 1.5;

            font-weight: 700;

            color: #176b99;
        }


        /* الوصف */

        .description {
            color: #8997a0;

            font-size: 17px;

            line-height: 1.9;

            margin: 12px 0 22px;
        }


        /* الخط الملون */

        .color-wave {
            width: 125px;
            height: 8px;

            margin: 0 auto 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #5b9d4c 0%,
                    #176b99 48%,
                    #b5458b 100%
                );

            opacity: 0.85;

            transform: rotate(-2deg);
        }


        /* النجوم */

        .stars {
            direction: rtl;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            margin: 0 0 10px;
        }


        .star {
            font-size: 52px;

            line-height: 1;

            color: #f1eadb;

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }


        .star:hover {
            transform: scale(1.12);
        }


        /* النجمة المختارة - ممتلئة بالكامل */

        .star.active {
            color: #f4c542;
        }


        /* رسالة التقييم */

        #ratingText {
            min-height: 28px;

            margin: 10px 0 28px;

            color: #6f818b;

            font-size: 15px;

            line-height: 1.7;
        }


        /* عنوان الملاحظات */

        .feedback-label {
            text-align: right;

            color: #176b99;

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        /* مربع الملاحظات */

        textarea {
            width: 100%;

            height: 150px;

            resize: none;

            border: 1px solid #d7e1e5;

            border-radius: 20px;

            padding: 18px;

            font-family: inherit;

            font-size: 16px;

            line-height: 1.8;

            outline: none;

            background: rgba(255, 255, 255, 0.90);

            color: #30434d;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        textarea::placeholder {
            color: #a8b3b9;
        }


        textarea:focus {
            border-color: #5b9d4c;

            box-shadow:
                0 0 0 4px rgba(91, 157, 76, 0.08);

            background: #ffffff;
        }


        /* زر الإرسال */

        button {
            width: 260px;

            max-width: 100%;

            border: none;

            background: #5b9d4c;

            color: #ffffff;

            padding: 16px 25px;

            border-radius: 50px;

            font-size: 18px;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

            margin-top: 24px;

            box-shadow:
                0 8px 22px rgba(91, 157, 76, 0.18);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        button:hover {
            background: #4f8e43;

            transform: translateY(-2px);

            box-shadow:
                0 10px 26px rgba(91, 157, 76, 0.24);
        }


        button:active {
            transform: translateY(0);
        }


        /* رسالة الشكر */

        #thankYou {
            display: none;

            margin-top: 25px;

            color: #9aa8af;

            font-size: 15px;
        }


        /* أسفل الصفحة */

        .footer-note {
            margin-top: 30px;

            color: #a5b0b5;

            font-size: 14px;
        }


        /* الجوال */

        @media (max-width: 600px) {

            header {
                height: 95px;
            }


            .logo {
                width: 120px;
            }


            .container {
                min-height: calc(100vh - 95px);

                padding: 30px 15px 50px;
            }


            .card {
                padding: 38px 22px 32px;

                border-radius: 25px;
            }


            .small-title {
                font-size: 10px;

                letter-spacing: 3px;
            }


            h1 {
                font-size: 26px;
            }


            .description {
                font-size: 15px;

                margin-top: 10px;
            }


            .color-wave {
                width: 100px;

                margin-bottom: 25px;
            }


            .stars {
                gap: 7px;
            }


            .star {
                font-size: 42px;
            }


            #ratingText {
                font-size: 14px;

                margin-bottom: 22px;
            }


            textarea {
                height: 135px;

                font-size: 15px;
            }


            button {
                width: 100%;

                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<header>

    <!-- شعار MERCATO -->
    <img
        src="./logo.jpeg"
        class="logo"
        alt="MERCATO"
    >

</header>



<div class="container">

    <div class="card">


        <div class="small-title">
            MERCATO
        </div>


        <h1>
            كيف كانت تجربتك معنا؟
        </h1>


        <div class="description">
            رأيك يهمنا ويساعدنا لنكون أفضل دائماً
        </div>


        <div class="color-wave"></div>


        <!-- النجوم من اليمين لليسار -->

        <div class="stars">

            <span
                class="star"
                data-rating="1">
                ★
            </span>

            <span
                class="star"
                data-rating="2">
                ★
            </span>

            <span
                class="star"
                data-rating="3">
                ★
            </span>

            <span
                class="star"
                data-rating="4">
                ★
            </span>

            <span
                class="star"
                data-rating="5">
                ★
            </span>

        </div>


        <div id="ratingText"></div>


        <div class="feedback-label">
            ملاحظاتك
        </div>


        <textarea
            id="feedback"
            placeholder="اكتب ملاحظاتك هنا ..."></textarea>


        <button onclick="submitRating()">
            إرسال التقييم →
        </button>


        <div id="thankYou">
            شكرًا لك 🤍 نقدر وقتك ومشاركتك لرأيك.
        </div>


        <div class="footer-note">
            رأيك يصنع فرقًا ✦
        </div>


    </div>

</div>



<script>


    // رابط الدعم الفني

    const supportUrl =
        "https://wa.me/966920021310";


    // روابط Google Review للفروع

    const branchLinks = {

        "1":
            "https://g.page/r/Ca3jSr1Z0dUYEBM/review",

        "2":
            "https://g.page/r/CdllYciMoT8GEBM/review",

        "3":
            "https://g.page/r/CbNrebES7OEiEBM/review",

        "4":
            "https://g.page/r/CVAh0_CJDoo1EBM/review",

        "5":
            "https://g.page/r/CfrU07iMJpmpEBM/review",

        "6":
            "https://g.page/r/CQRdKswUzDrTEBM/review",

        "7":
            "https://g.page/r/Cd427IaBBwTDEBM/review",

        "8":
            "https://maps.app.goo.gl/jsJ6x368d5EQ8ht6A",

        "9":
            "https://g.page/r/CWbsamymNfqbEBM/review",

        "10":
            "https://g.page/r/CWT69dlXEyXDEBM/review",

        "11":
            "https://g.page/r/CSPtzNKMBkSTEBM/review",

        "12":
            "https://g.page/r/CaUq9hk10TkFEBM/review",

        "13":
            "https://g.page/r/CSVAo0c_XHlMEBM/review",

        "14":
            "https://g.page/r/CU12tV0Av1tWEBM/review",

        "15":
            "https://g.page/r/CX6cv1eiMksiEBM/review",

        "16":
            "https://g.page/r/CWxbPgb3sCpLEBM/review",

        "17":
            "https://g.page/r/CQc_0qnQtHzyEBM/review",

        "18":
            "https://maps.app.goo.gl/LN2hneroRqdXBQVY8",

        "19":
            "https://g.page/r/CeRzQxhd84AIEBM/review",

        "20":
            "https://g.page/r/CV7O-FIlni6REBM/review",

        "21":
            "https://g.page/r/CfK7zOR61FmhEBM/review"

    };


    // تحديد الفرع من الرابط

    const params =
        new URLSearchParams(
            window.location.search
        );

    const branch =
        params.get("branch");


    // النجوم

    const stars =
        document.querySelectorAll(".star");

    const ratingText =
        document.getElementById("ratingText");

    let selectedRating = 0;


    stars.forEach(star => {

        star.addEventListener(
            "click",
            function () {

                selectedRating =
                    Number(
                        this.dataset.rating
                    );


                stars.forEach(item => {

                    const rating =
                        Number(
                            item.dataset.rating
                        );


                    if (
                        rating <= selectedRating
                    ) {

                        item.classList.add(
                            "active"
                        );

                    } else {

                        item.classList.remove(
                            "active"
                        );

                    }

                });


                const messages = {

                    1:
                        "نأسف أن تجربتك لم تكن بالمستوى المطلوب",

                    2:
                        "نحتاج إلى تحسين تجربتك",

                    3:
                        "تجربة جيدة",

                    4:
                        "تجربة ممتازة",

                    5:
                        "تجربة رائعة! 🤍"

                };


                ratingText.textContent =
                    messages[selectedRating];

            }

        );

    });


    // إرسال التقييم

    function submitRating() {

        if (selectedRating === 0) {

            alert(
                "فضلاً اختر تقييمك أولاً ⭐"
            );

            return;
        }


        // تقييم 1 إلى 3 = واتساب الدعم

        if (selectedRating <= 3) {

            window.location.href =
                supportUrl;

            return;
        }


        // تقييم 4 إلى 5 = Google Review

        if (selectedRating >= 4) {

            const mapsUrl =
                branchLinks[branch];


            if (mapsUrl) {

                window.location.href =
                    mapsUrl;

            } else {

                alert(
                    "تعذر تحديد الفرع. تأكدي من رابط التقييم."
                );

            }

        }

    }

</script>


</body>

</html>
