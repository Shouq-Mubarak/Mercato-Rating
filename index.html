<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERCATO | تقييم تجربتك</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 15%,rgba(47,157,122,.10) 0 90px,transparent 91px),
    radial-gradient(circle at 90% 85%,rgba(188,65,135,.09) 0 110px,transparent 111px),
    radial-gradient(circle at 85% 12%,rgba(44,121,168,.08) 0 80px,transparent 81px),
    #fafafa;
  color:#333;
}

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px 16px;
}

.card{
  width:100%;
  max-width:560px;
  background:#fff;
  border-radius:28px;
  padding:38px 30px 28px;
  text-align:center;
  box-shadow:0 18px 55px rgba(0,0,0,.07);
  position:relative;
  overflow:hidden;
}

.top-line{
  height:5px;
  width:100%;
  position:absolute;
  top:0;
  right:0;
  background:linear-gradient(
    90deg,
    #2c9b78,
    #2879a8,
    #c24d91,
    #2c9b78
  );
}

.logo-wrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:8px 0 22px;
}

.logo{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
  border:4px solid #fff;
}

h1{
  margin:0 0 10px;
  font-size:29px;
  color:#2879a8;
  font-weight:700;
}

.description{
  margin:0 auto 18px;
  color:#777;
  font-size:15px;
  line-height:1.8;
}

.color-line{
  width:105px;
  height:4px;
  margin:0 auto 24px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #2c9b78 0 33%,
    #2879a8 33% 66%,
    #c24d91 66%
  );
}

.stars{
  direction:rtl;
  display:flex;
  justify-content:center;
  gap:7px;
  margin-bottom:8px;
}

.star{
  color:#eee9df;
  font-size:49px;
  line-height:1;
  cursor:pointer;
  transition:transform .18s ease,color .18s ease;
  user-select:none;
}

.star:hover{
  transform:scale(1.08);
}

.star.active{
  color:#f4c542;
}

#ratingText{
  min-height:27px;
  margin:10px 0 20px;
  color:#555;
  font-size:14px;
}

label{
  display:block;
  text-align:right;
  color:#2879a8;
  font-weight:700;
  margin:0 0 8px;
  font-size:14px;
}

textarea{
  width:100%;
  height:125px;
  resize:none;
  border:1px solid #e4e4e4;
  border-radius:16px;
  padding:14px;
  font-family:inherit;
  font-size:14px;
  outline:none;
  background:#fff;
  color:#333;
  margin-bottom:16px;
}

textarea:focus{
  border-color:#2879a8;
  box-shadow:0 0 0 3px rgba(40,121,168,.08);
}

button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:15px 20px;
  background:#2c9b78;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

button:hover{
  background:#238363;
  transform:translateY(-1px);
}

footer{
  margin-top:20px;
  color:#aaa;
  font-size:12px;
}

@media(max-width:600px){

  .page{
    padding:18px 12px;
  }

  .card{
    padding:32px 20px 22px;
    border-radius:24px;
  }

  .logo{
    width:135px;
    height:135px;
  }

  h1{
    font-size:24px;
  }

  .description{
    font-size:14px;
  }

  .star{
    font-size:42px;
  }
}
</style>
</head>

<body>

<div class="page">

<main class="card">

<div class="top-line"></div>

<div class="logo-wrapper">
<img src="./logo.jpeg.jpeg" class="logo" alt="MERCATO">
</div>

<h1>كيف كانت تجربتك معنا؟</h1>

<p class="description">
رأيك يهمنا ويساعدنا لنكون أفضل دائماً
</p>

<div class="color-line"></div>

<div class="stars" aria-label="التقييم">

<span class="star" data-rating="1">★</span>
<span class="star" data-rating="2">★</span>
<span class="star" data-rating="3">★</span>
<span class="star" data-rating="4">★</span>
<span class="star" data-rating="5">★</span>

</div>

<div id="ratingText"></div>

<label for="feedback">ملاحظاتك</label>

<textarea
id="feedback"
placeholder="اكتب لنا ملاحظاتك (اختياري)"
></textarea>

<button type="button" onclick="submitRating()">
إرسال التقييم
</button>

<footer>
شكراً لك على وقتك ومشاركتك لرأيك 🤍
</footer>

</main>

</div>


<script>

const supportUrl =
"https://wa.me/966920021310";


const branchLinks = {

"1":
"https://search.google.com/local/writereview?placeid=ChIJx1prR0YFLz4RreNKvVnR1Rg",

"2":
"https://search.google.com/local/writereview?placeid=ChIJk5u_zusBLz4R2WVhyIyhPwY",

"3":
"https://search.google.com/local/writereview?placeid=ChIJfRyqOI0PLz4Rs2t5sRLs4SI",

"4":
"https://search.google.com/local/writereview?placeid=ChIJpaxGw_urLz4RUCHT8IkOijU",

"5":
"https://search.google.com/local/writereview?placeid=ChIJg8yTl0PQwxUR-tTTuIwmmak",

"6":
"https://search.google.com/local/writereview?placeid=ChIJz6HrZDmJ6RURBF0qzBTMOtM",

"7":
"https://search.google.com/local/writereview?placeid=ChIJkVoH9Qr9ST4R3jbshoEHBMM",

"8":
"https://search.google.com/local/writereview?placeid=ChIJbWeXLXv8ST4Rc-LKTr8XamM",

"9":
"https://search.google.com/local/writereview?placeid=ChIJ_bV1UkfpST4RZuxqbKY1-ps",

"10":
"https://search.google.com/local/writereview?placeid=ChIJnV4PWBHvgRURZPr12VcTJcM",

"11":
"https://search.google.com/local/writereview?placeid=ChIJsSjNzXdXfxURI-3M0owGRJM",

"12":
"https://search.google.com/local/writereview?placeid=ChIJq5JfE3i5vRURpSr2GTXROQU",

"13":
"https://search.google.com/local/writereview?placeid=ChIJd54MeaWtqRURJUCjRz9ceUw",

"14":
"https://search.google.com/local/writereview?placeid=ChIJAes6kg9HdhURTXa1XQC_W1Y",

"15":
"https://search.google.com/local/writereview?placeid=ChIJB1RrDahV4xURfpy_V6IySyI",

"16":
"https://search.google.com/local/writereview?placeid=ChIJwZ3WSgCr_BURbFs-BvewKks",

"17":
"https://search.google.com/local/writereview?placeid=ChIJ29udk-JY-xURBz_SqdC0fPI",

"18":
"https://search.google.com/local/writereview?placeid=ChIJYyBPLw2F5BURsxdFp8hqmW0",

"19":
"https://search.google.com/local/writereview?placeid=ChIJHevpGHjD_hUR5HNDGF3zgAg",

"20":
"https://search.google.com/local/writereview?placeid=ChIJ3aESDqyXNz4RXs74UiWeLpE",

"21":
"https://search.google.com/local/writereview?placeid=ChIJneS2VABB1z8R8rvM5HrUWaE"

};


const branch =
new URLSearchParams(window.location.search).get("branch");


const stars =
document.querySelectorAll(".star");

const ratingText =
document.getElementById("ratingText");

let selectedRating = 0;


stars.forEach(star => {

star.addEventListener("click", function(){

selectedRating =
Number(this.dataset.rating);


stars.forEach(item => {

item.classList.toggle(
"active",
Number(item.dataset.rating) <= selectedRating
);

});


ratingText.textContent = {

1:"نأسف أن تجربتك لم تكن بالمستوى المطلوب",

2:"نحتاج إلى تحسين تجربتك",

3:"تجربة جيدة",

4:"تجربة ممتازة",

5:"تجربة رائعة! 🤍"

}[selectedRating];

});

});


function submitRating(){

if(!selectedRating){

alert("فضلاً اختر تقييمك أولاً ⭐");

return;

}


if(selectedRating <= 3){

window.location.href =
supportUrl;

return;

}


const mapsUrl =
branchLinks[branch];


if(mapsUrl){

window.location.href =
mapsUrl;

}else{

alert(
"تعذر تحديد الفرع. تأكدي من رابط التقييم."
);

}

}

</script>

</body>
</html>
